apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ include "payment-web.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "payment-web.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "payment-web.selectorLabels" . | nindent 4 }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-{{ include "payment-web.name" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "payment-web.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $.Release.Name }}-{{ include "payment-web.name" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
{{- if .Values.configMap.create }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configMap.name | default (printf "%s-%s-config" .Release.Name (include "payment-web.name" .)) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "payment-web.labels" . | nindent 4 }}
data:
  cacheTtl: {{ .Values.config.cacheTtl | quote }}
  apiBase: {{ .Values.config.apiBase | quote }}
{{- end }}
{{- if .Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}-{{ include "payment-web.name" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "payment-web.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "payment-web.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
